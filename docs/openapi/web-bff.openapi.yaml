openapi: 3.1.0
info:
  title: AZZU Web BFF API
  version: 1.0.0-draft
  description: Contrato same-origin consumido exclusivamente por bancocloud-web.
  license:
    name: Propietaria de AZZU
    identifier: LicenseRef-AZZU-Proprietary
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/status:
    get:
      security: []
      summary: Consultar disponibilidad de configuración del login, no salud del proveedor
      operationId: getLoginStatus
      responses:
        '200':
          description: Estado mínimo sin exponer configuración; Cache-Control no-store
          content: { application/json: { schema: { type: object, required: [loginAvailable], properties: { loginAvailable: { type: boolean } } } } }
  /auth/login:
    get:
      security: []
      summary: Iniciar OIDC Authorization Code con PKCE; no recibe credenciales
      operationId: beginLogin
      parameters: [{ name: returnUrl, in: query, schema: { type: string }, description: Solo rutas /portal; queries y fragmentos descartados }]
      responses:
        '302': { description: Redirect al proveedor OIDC; retorno seguro al portal }
        '503': { description: OIDC no configurado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /auth/step-up:
    get:
      summary: Iniciar challenge de Authentication Context sin destruir la sesión
      operationId: beginStepUp
      parameters:
        - { name: returnUrl, in: query, schema: { type: string }, description: Ruta /portal sin query ni fragmento }
        - { name: operation, in: query, schema: { type: string }, description: Operación con Authentication Context configurado en BFF }
      responses:
        '302': { description: Redirect OIDC con claims challenge }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: OIDC o Authentication Context no configurado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /auth/session:
    get:
      summary: Consultar la sesión web vigente
      operationId: getSession
      responses:
        '200':
          description: Sesión autenticada
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthenticatedSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: CUSTOMER_IDENTITY_NOT_LINKED o CUSTOMER_ACCESS_DENIED; conservar sesión, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: CUSTOMER_IDENTITY_MAPPING_UNAVAILABLE; conservar sesión, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /auth/logout:
    description: Obtener primero GET /auth/csrf; el logout no depende de Mapping
    post:
      summary: Cerrar la sesión web vigente
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      responses:
        '204': { description: Sesión revocada }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /auth/csrf:
    get:
      summary: Emitir cookies antiforgery para una sesión autenticada, sin consultar Mapping
      operationId: issueCsrfToken
      responses:
        '204': { description: Cookies XSRF emitidas con no-store }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/digital-key:
    put:
      summary: Cambiar la clave digital
      operationId: changeDigitalKey
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DigitalKeyChange' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /auth/sessions/revoke-others:
    post:
      summary: Revocar las demás sesiones del cliente
      operationId: revokeOtherSessions
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /customers/me/display-name:
    get:
      summary: Consultar el nombre visible del cliente
      operationId: getCustomerDisplayName
      responses:
        '200': { description: Nombre de visualización, content: { application/json: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customers/me/profile:
    put:
      summary: Actualizar el perfil del cliente
      operationId: updateProfile
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /accounts:
    get:
      summary: Consultar las cuentas autorizadas del cliente
      operationId: getAccounts
      responses:
        '200': { description: Productos autorizados del cliente, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Account' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /transactions:
    get:
      summary: Consultar los movimientos autorizados del cliente
      operationId: getTransactions
      responses:
        '200': { description: Movimientos autorizados, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications:
    get:
      summary: Consultar las notificaciones del cliente
      operationId: getNotifications
      responses:
        '200': { description: Notificaciones, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read:
    post:
      summary: Marcar notificaciones como leídas
      operationId: markNotificationsRead
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /notifications/preferences:
    put:
      summary: Actualizar preferencias de notificaciones
      operationId: updateNotificationPreferences
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /transfers:
    post:
      summary: Crear una transferencia bancaria
      operationId: createTransfer
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /payments:
    post:
      summary: Crear un pago de servicio
      operationId: createPayment
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /loans/simulations:
    post:
      summary: Simular un préstamo
      operationId: simulateLoan
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoanSimulationRequest' } } } }
      responses:
        '200': { description: Simulación, content: { application/json: { schema: { $ref: '#/components/schemas/LoanSimulation' } } } }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /loans/applications:
    post:
      summary: Solicitar un préstamo
      operationId: applyForLoan
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoanApplicationRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /procedures:
    post:
      summary: Registrar un trámite bancario
      operationId: submitProcedure
      parameters: [{ $ref: '#/components/parameters/XsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProcedureRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
  /cards/{cardId}/controls:
    put:
      summary: Actualizar los controles de una tarjeta
      operationId: updateCardControls
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CardControlUpdate' } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
  /cards/{cardId}/temporary-block:
    put:
      summary: Bloquear o desbloquear temporalmente una tarjeta
      operationId: setCardTemporaryBlock
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [blocked], properties: { blocked: { type: boolean } } } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedOperation' }
        '401': { $ref: '#/components/responses/StepUpRequired' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-AzzuSession }
  parameters:
    XsrfToken: { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    AcceptedOperation: { description: Operación aceptada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiOperation' } } } }
    Unauthorized:
      description: >-
        Sesión ausente/vencida (INVALID_SESSION_CONTEXT, limpiar sesión), o autorización
        delegada requiere interacción (BANKING_REAUTHENTICATION_REQUIRED, conservar sesión
        y volver al login local; no reproducir automáticamente la operación).
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: Presente cuando se necesita interacción; nunca seguir una URI externa recibida.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CsrfValidationFailed:
      description: Token antifalsificación ausente, inválido o vencido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Conflicto de idempotencia o estado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    StepUpRequired:
      description: >-
        STEP_UP_REQUIRED conserva sesión y exige contexto de autenticación aprobado.
        BANKING_REAUTHENTICATION_REQUIRED conserva sesión y requiere login interactivo.
        INVALID_SESSION_CONTEXT indica sesión inválida y requiere limpiar sesión.
      headers:
        WWW-Authenticate:
          required: false
          schema: { type: string }
          example: 'OIDC error="insufficient_user_authentication", step_up_uri="/api/v1/auth/step-up?operation=transfers.create"'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/StepUpError' } } }
  schemas:
    AuthenticatedSession:
      type: object
      required: [customerId, displayName, expiresAtUtc, idleTimeoutSeconds, authenticationMethods]
      properties:
        customerId: { type: string, format: uuid }
        displayName: { type: string, maxLength: 120 }
        expiresAtUtc: { type: string, format: date-time }
        idleTimeoutSeconds: { type: integer, minimum: 60, maximum: 3600 }
        authenticationMethods: { type: array, items: { type: string } }
    ApiError:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, description: Identificador estable del tipo de problema }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        correlationId: { type: string }
        X-Correlation-ID: { type: string, description: Extensión del BFF; también se devuelve como header }
    StepUpError:
      allOf:
        - { $ref: '#/components/schemas/ApiError' }
        - { type: object, properties: { challengeId: { type: string, description: Opcional; el challenge principal viene en WWW-Authenticate } } }
    ApiOperation:
      type: object
      required: [id, status, message]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, completed] }
        message: { type: string }
    Account:
      type: object
      required: [id, name, type, lastDigits, balance, available, accent]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        lastDigits: { type: string, pattern: '^\\d{4}$' }
        balance: { type: number }
        available: { type: number }
        accent: { type: string, enum: [violet, blue] }
        currency: { type: string, enum: [PEN, USD], default: PEN }
    Transaction:
      type: object
      required: [id, accountId, counterparty, detail, date, amount, category, initials, color]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        counterparty: { type: string }
        detail: { type: string }
        date: { type: string, format: date-time }
        amount: { type: number }
        category: { type: string, enum: [income, expense] }
        initials: { type: string }
        color: { type: string, enum: [coral, purple, green] }
    Notification:
      type: object
      required: [id, type, title, detail, date, route, unread]
      properties:
        id: { type: string }
        type: { type: string, enum: [transfer, card, security] }
        title: { type: string }
        detail: { type: string }
        date: { type: string }
        route: { type: string, description: Ruta relativa interna bajo /portal }
        unread: { type: boolean }
    TransferRequest:
      type: object
      required: [sourceAccountId, recipientDocument, recipientName, amount, description]
      properties:
        sourceAccountId: { type: string, format: uuid }
        recipientDocument: { type: string, pattern: '^\\d{8}$' }
        recipientName: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string, maxLength: 140 }
    PaymentRequest:
      type: object
      required: [sourceAccountId, service, customerCode, amount]
      properties:
        sourceAccountId: { type: string, format: uuid }
        service: { type: string, enum: [Luz, Agua, Celular, Internet] }
        customerCode: { type: string, maxLength: 40 }
        amount: { type: number, exclusiveMinimum: 0 }
    LoanSimulationRequest:
      type: object
      required: [amount, termMonths, monthlyIncome]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        termMonths: { type: integer, minimum: 1, maximum: 72 }
        monthlyIncome: { type: number, exclusiveMinimum: 0 }
    LoanApplicationRequest:
      allOf:
        - { $ref: '#/components/schemas/LoanSimulationRequest' }
        - { type: object, required: [simulationAccepted], properties: { simulationAccepted: { type: boolean, const: true } } }
    LoanSimulation:
      type: object
      required: [monthlyPayment, totalPayment, annualRate]
      properties:
        monthlyPayment: { type: number }
        totalPayment: { type: number }
        annualRate: { type: number }
    ProfileUpdate:
      type: object
      required: [email, phone, address]
      properties:
        email: { type: string, format: email }
        phone: { type: string, pattern: '^9\\d{8}$' }
        address: { type: string, maxLength: 200 }
    DigitalKeyChange:
      type: object
      required: [currentKey, newKey]
      properties:
        currentKey: { type: string, pattern: '^\\d{6}$' }
        newKey: { type: string, pattern: '^\\d{6}$' }
    NotificationPreferences:
      type: object
      required: [transfers, cardPurchases, security, marketing, channel]
      properties:
        transfers: { type: boolean }
        cardPurchases: { type: boolean }
        security: { type: boolean }
        marketing: { type: boolean }
        channel: { type: string, enum: [email, push, both] }
    ProcedureRequest:
      type: object
      required: [type, detail]
      properties:
        type: { type: string, enum: [bank-certificate, data-update, claim] }
        detail: { type: string, maxLength: 1000 }
    CardControlUpdate:
      type: object
      required: [cardId, purchaseLimit, onlinePaymentsEnabled]
      properties:
        cardId: { type: string, format: uuid }
        purchaseLimit: { type: number, minimum: 0 }
        onlinePaymentsEnabled: { type: boolean }
